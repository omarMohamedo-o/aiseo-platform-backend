# Reference configuration overlay. Values here mirror aiseo.infrastructure
# .configuration.settings.Settings and are the source of truth for
# AISEO_-prefixed environment variables consumed at process startup
# (see docs/architecture.md#17-configuration).
environment: development

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0

embeddings:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

clustering:
  algorithm: hdbscan
  min_cluster_size: 5

scoring:
  seo_version: seo-v1
  aeo_version: aeo-v1
  geo_version: geo-v1

mlflow:
  tracking_uri: sqlite:///mlflow.db

database:
  url: postgresql+psycopg://aiseo:aiseo@localhost:5432/aiseo
  pool_size: 10

redis:
  url: redis://localhost:6379/0
